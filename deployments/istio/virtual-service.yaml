apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: pubsubgo-vs
  namespace: pubsubgo
spec:
  hosts:
    - pubsubgo.local
  gateways:
    - pubsubgo-gateway
  http:
    - match:
        - uri:
            prefix: /api/v1
      route:
        - destination:
            host: pubsubgo
            port:
              number: 8080
      fault:
        delay:
          percentage:
            value: 0.1
          fixedDelay: 5s
      retries:
        attempts: 3
        perTryTimeout: 10s
    - match:
        - uri:
            prefix: /ws
      route:
        - destination:
            host: pubsubgo
            port:
              number: 8080
      timeout: 0s  # WebSocket connections need no timeout
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: pubsubgo
            port:
              number: 8080
