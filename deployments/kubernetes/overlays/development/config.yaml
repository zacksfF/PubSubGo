server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  shutdown_timeout: 30s
  max_request_size: 8388608 # 8MB
  enable_websocket: true

storage:
  type: redis
  max_message_size: 1048576 # 1MB
  max_queue_size: 1000  # Reduced for dev
  retention_time: 1h    # Shorter retention for dev
  cleanup_interval: 10m

redis:
  addresses:
    - dev-redis:6379
  password: ""
  db: 0
  max_retries: 3
  pool_size: 10     # Smaller pool for dev
  min_idle_conns: 2
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
  pool_timeout: 4s
  idle_timeout: 5m
  idle_check_frequency: 1m
  enable_cluster: false

broker:
  default_partitions: 2  # Fewer partitions for dev
  default_replication: 1
  max_message_batch_size: 100  # Smaller batch for dev
  batch_flush_interval: 100ms
  compression_type: snappy
  compression_level: 6
  enable_deduplication: true
  deduplication_window: 1m  # Shorter window for dev
  default_ack_deadline: 30s
  max_retries: 3
  retry_backoff: 1s
  enable_dlq: true
  dlq_prefix: "dlq-"

metrics:
  enabled: true
  port: 9091
  path: /metrics
  collect_interval: 30s  # More frequent for dev
  namespace: pubsubgo

tracing:
  enabled: true
  service_name: pubsubgo-dev
  otlp_endpoint: http://dev-otel-collector:4318/v1/traces
  sampling_rate: 1.0  # 100% sampling for dev

rate_limit:
  enabled: false  # Disabled for dev
  requests_per_second: 1000
  burst_size: 100
  per_topic: true
  per_consumer: false