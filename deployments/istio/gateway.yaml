apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: pubsubgo-gateway
  namespace: pubsubgo
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - pubsubgo.local
        - grafana.local
        - prometheus.local
        - jaeger.local
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: pubsubgo-tls
      hosts:
        - pubsubgo.local
        - grafana.local
        - prometheus.local
        - jaeger.local