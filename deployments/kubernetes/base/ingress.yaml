apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pubsubgo-ingress
  namespace: pubsubgo
  annotations:
    kubernetes.io/ingress.class: istio
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: pubsubgo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pubsubgo
                port:
                  number: 8080
    - host: grafana.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
    - host: prometheus.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
    - host: jaeger.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger
                port:
                  number: 16686