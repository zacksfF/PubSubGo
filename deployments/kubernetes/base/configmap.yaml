apiVersion: v1
kind: ConfigMap
metadata:
  name: pubsubgo-config
  namespace: pubsubgo
data:
  config.yaml: |
    server:
      host: 0.0.0.0
      port: 8080
      read_timeout: 30s
      write_timeout: 30s
      idle_timeout: 120s
      shutdown_timeout: 30s
      max_request_size: 8388608 # 8MB
      enable_websocket: true
      tls:
        enabled: false
        cert_file: ""
        key_file: ""
        ca_file: ""

    storage:
      type: redis # memory, redis, postgres
      max_message_size: 1048576 # 1MB
      max_queue_size: 10000
      retention_time: 24h
      cleanup_interval: 1h

    redis:
      addresses:
        - redis:6379
      password: ""
      db: 0
      max_retries: 3
      pool_size: 100
      min_idle_conns: 10
      dial_timeout: 5s
      read_timeout: 3s
      write_timeout: 3s
      pool_timeout: 4s
      idle_timeout: 5m
      idle_check_frequency: 1m
      enable_cluster: false

    broker:
      default_partitions: 4
      default_replication: 1
      max_message_batch_size: 1000
      batch_flush_interval: 100ms
      compression_type: snappy # none, snappy, gzip, lz4
      compression_level: 6
      enable_deduplication: true
      deduplication_window: 5m
      default_ack_deadline: 30s
      max_retries: 3
      retry_backoff: 1s
      enable_dlq: true
      dlq_prefix: "dlq-"

    metrics:
      enabled: true
      port: 9091
      path: /metrics
      collect_interval: 10s
      namespace: pubsubgo

    tracing:
      enabled: true
      service_name: pubsubgo
      otlp_endpoint: http://otel-collector:4318/v1/traces
      sampling_rate: 0.1

    rate_limit:
      enabled: true
      requests_per_second: 10000
      burst_size: 1000
      per_topic: true
      per_consumer: false